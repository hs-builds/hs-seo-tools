<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f9fa;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh; /* Center vertically */
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      animation: bounce 2s infinite;
    }

    h2 {
      margin: 0 0 10px 0;
      color: #1a73e8;
      font-size: 20px;
      font-weight: 600;
    }

    p {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
      max-width: 260px;
    }

    .footer {
      margin-top: 30px;
      font-size: 11px;
      color: #bdc1c6;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-10px);}
      60% {transform: translateY(-5px);}
    }
  </style>
</head>
<body>

  <div class="icon">🚧</div>
  <h2>Coming Soon</h2>
  <p>We are building an awesome GA4 integration tool here.</p>
  <p style="margin-top:8px;">Stay tuned for updates!</p>

  <div class="footer">
    HS SEO Tools
  </div>

</body>
</html>
